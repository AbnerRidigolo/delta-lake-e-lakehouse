# Atualizacao automatica de dependencias.
#
# Em um projeto de dados isso importa mais do que parece: uma versao nova de
# PySpark ou de Delta pode mudar comportamento de cast, de particionamento ou de
# time travel. Com o CI rodando o pipeline inteiro em cada PR, o Dependabot vira
# um teste de compatibilidade automatico - a atualizacao so passa se o pipeline
# continuar produzindo dado valido.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Spark e Delta precisam subir juntos: as versoes sao acopladas.
      spark-delta:
        patterns: ["pyspark", "delta-spark"]
      ciencia-de-dados:
        patterns: ["pandas", "numpy", "pyarrow", "scikit-learn", "joblib", "xgboost"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "chore(ci)"
