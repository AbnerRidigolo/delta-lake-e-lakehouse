name: Monitoramento de qualidade de dados

# Diferente do CI, que valida MUDANCA DE CODIGO, este workflow valida o DADO ao
# longo do tempo. Roda todo dia e responde a pergunta que o CI nao responde:
# "o dado de hoje continua parecido com o de ontem?"
#
# E aqui que a deteccao de drift ganha sentido: comparar o volume e a
# distribuicao de hoje contra a mediana das execucoes anteriores so funciona se
# existir uma serie historica — que este agendamento constroi.
#
# Em producao, o equivalente seria o mesmo pipeline rodando no Airflow contra o
# dado real, com o scorecard alimentando um painel de qualidade.

on:
  schedule:
    # 06:12 UTC = 03:12 em Brasilia. Minuto quebrado de proposito: o :00 e o
    # horario em que meio mundo agenda job, e a fila do runner sofre.
    - cron: "12 6 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de configuracao"
        required: false
        default: "ci"
        type: choice
        options: ["ci", "default"]

permissions:
  contents: read
  issues: write        # necessario para abrir a issue de alerta

jobs:
  qualidade:
    name: Executar pipeline e avaliar qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Cache dos JARs do Delta Lake
        uses: actions/cache@v4
        with:
          path: .ivy2
          key: ivy-${{ runner.os }}-delta3.2.1-spark3.5.3
          restore-keys: ivy-${{ runner.os }}-

      # A serie historica de qualidade vive na propria tabela Delta
      # `quality.dq_results`. Restaurar o cache entre execucoes e o que permite
      # comparar o volume de hoje com a mediana dos dias anteriores.
      - name: Restaurar historico de qualidade
        uses: actions/cache@v4
        with:
          path: data-ci/quality
          key: historico-qualidade-${{ github.run_id }}
          restore-keys: historico-qualidade-

      - name: Executar o pipeline
        id: pipeline
        env:
          PYTHONPATH: .
          LAKEHOUSE_PROFILE: ${{ inputs.profile || 'ci' }}
          LAKEHOUSE_ROOT: data-ci
          PIPELINE_RUN_ID: nightly-${{ github.run_id }}
        run: python -m orchestration.run_pipeline --skip delta_maintenance

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-${{ github.run_id }}
          path: data-ci/reports/
          retention-days: 30
          if-no-files-found: warn

      # Falha em monitoramento agendado nao pode morrer no log: ninguem olha o
      # historico de workflow. Uma issue chega em quem precisa agir.
      - name: Abrir issue quando a qualidade reprovar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Qualidade de dados reprovada em ${new Date().toISOString().slice(0, 10)}`;
            const corpo = [
              'O monitoramento diario de qualidade falhou.',
              '',
              `- **Execucao:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- **Scorecard e relatorios:** disponiveis nos artefatos da execucao.',
              '',
              'Verifique, nesta ordem:',
              '1. contratos de schema (mudanca na origem);',
              '2. conciliacao entre camadas (perda ou duplicacao de dados);',
              '3. drift de volume e de distribuicao;',
              '4. expectativas por tabela no scorecard.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            // Evita empilhar uma issue por dia enquanto o problema persiste.
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'qualidade-de-dados',
            });
            if (abertas.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: corpo, labels: ['qualidade-de-dados'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: abertas.data[0].number, body: corpo,
              });
            }
