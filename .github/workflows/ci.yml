name: CI

# Estrategia: o CI executa o PIPELINE INTEIRO — todas as 23 etapas, todas as
# regras de qualidade — usando o perfil `ci`, que reduz apenas o VOLUME dos
# dados. Um CI que exercita um caminho diferente do de producao nao testa nada.
#
#   lint  ──> testes rapidos ──┐
#                              ├──> pipeline + portao de qualidade
#                              ┘
# O portao de qualidade e o mesmo do pipeline de producao: se a nota do
# scorecard cair abaixo do minimo, o build falha. O scorecard e publicado no
# resumo do job, entao ele aparece direto na aba do Pull Request.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Um push novo cancela a execucao anterior do mesmo branch: economiza runner
# e evita que um resultado velho chegue depois do novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "17"

jobs:
  # =========================================================================
  # 1) Lint - roda em segundos e barra o obvio antes de subir um cluster Spark
  # =========================================================================
  lint:
    name: Lint e formatacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar o ruff
        run: pip install ruff==0.6.9

      - name: Verificar lint
        run: ruff check src orchestration tests

      - name: Verificar formatacao
        run: ruff format --check --diff src orchestration tests

      - name: Verificar sintaxe de todos os modulos
        run: python -m compileall -q src orchestration tests

  # =========================================================================
  # 2) Testes rapidos - os que nao precisam de Spark
  # =========================================================================
  testes-rapidos:
    name: Testes rapidos (sem Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias minimas
        run: pip install pytest pyyaml

      - name: Testar configuracao, DAG, catalogo e logica de qualidade
        env:
          PYTHONPATH: .
        # `-m "not spark"` usa o marcador aplicado automaticamente em
        # tests/conftest.py a todo teste que pede a fixture `spark`. Os testes de
        # integracao rodam no job do pipeline, onde as tabelas ja existem.
        run: pytest tests/ -q -m "not spark"

  # =========================================================================
  # 3) Pipeline completo + portao de qualidade
  # =========================================================================
  pipeline:
    name: Pipeline completo e portao de qualidade
    runs-on: ubuntu-latest
    needs: [lint, testes-rapidos]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java (requisito do Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest

      # Os JARs do Delta sao baixados do Maven na primeira execucao (~30 s).
      # Cachear evita pagar isso em todo push.
      - name: Cache dos JARs do Delta Lake
        uses: actions/cache@v6
        with:
          path: .ivy2
          key: ivy-${{ runner.os }}-delta3.2.1-spark3.5.3
          restore-keys: ivy-${{ runner.os }}-

      - name: Executar o pipeline (perfil CI)
        env:
          PYTHONPATH: .
          LAKEHOUSE_PROFILE: ci
          LAKEHOUSE_ROOT: data-ci
          # Amarra as tabelas geradas a execucao do workflow: as colunas de
          # auditoria passam a apontar para este run do GitHub Actions.
          PIPELINE_RUN_ID: gha-${{ github.run_id }}
        run: python -m orchestration.run_pipeline --skip delta_maintenance

      - name: Executar os testes de integracao (tabelas ja materializadas)
        env:
          PYTHONPATH: .
          LAKEHOUSE_PROFILE: ci
          LAKEHOUSE_ROOT: data-ci
        run: pytest tests/ -q

      # O scorecard ja se publica sozinho em $GITHUB_STEP_SUMMARY (ver
      # src/quality/scorecard.py). Aqui garantimos que ele fique disponivel
      # tambem como artefato, junto do relatorio analitico.
      - name: Publicar relatorios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade-${{ github.run_id }}
          path: |
            data-ci/reports/
            contracts/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar diagnostico em caso de falha
        if: failure()
        env:
          PYTHONPATH: .
          LAKEHOUSE_PROFILE: ci
          LAKEHOUSE_ROOT: data-ci
        # Quando o portao reprova, o que interessa e ver QUAIS regras falharam
        # sem precisar baixar artefato.
        run: |
          echo "### Diagnostico de qualidade" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from src.common.config import get_settings
          from src.common.delta_io import table_exists
          from src.common.spark_session import get_spark
          from pyspark.sql import functions as F

          spark = get_spark("diagnostico")
          path = get_settings().table_path("quality", "dq_results")
          if table_exists(spark, path):
              falhas = (spark.read.format("delta").load(path)
                        .where(~F.col("passed"))
                        .select("dataset", "expectation", "severity", "violations", "total_rows")
                        .limit(40).collect())
              if falhas:
                  print("| Tabela | Regra | Severidade | Violacoes | Linhas |")
                  print("|---|---|---|---:|---:|")
                  for f in falhas:
                      print(f"| `{f['dataset']}` | `{f['expectation']}` | {f['severity']} "
                            f"| {f['violations']} | {f['total_rows']} |")
              else:
                  print("Nenhuma expectativa falhou - a falha veio de outra etapa.")
          else:
              print("A tabela de qualidade nao chegou a ser criada.")
          PY
